name: Check Operator Channel Freshness

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday 8am UTC
  workflow_dispatch:
    inputs:
      ocp_version:
        description: 'OpenShift version tag (e.g., v4.17)'
        default: 'v4.17'
      mode:
        description: 'report = dry run, generate = create PR with missing overlays'
        type: choice
        options:
          - report
          - generate
        default: report

env:
  OCP_VERSION: ${{ inputs.ocp_version || 'v4.17' }}
  OPM_VERSION: v1.47.0

jobs:
  check-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install opm
        run: |
          curl -sLO "https://github.com/operator-framework/operator-registry/releases/download/${OPM_VERSION}/linux-amd64-opm"
          chmod +x linux-amd64-opm
          sudo mv linux-amd64-opm /usr/local/bin/opm
          opm version

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Authenticate to Red Hat registry
        run: |
          mkdir -p "${HOME}/.docker"
          echo '${{ secrets.REDHAT_PULL_SECRET }}' > "${HOME}/.docker/config.json"

      - name: Render and cache catalog data
        run: |
          CATALOG_IMAGE="registry.redhat.io/redhat/redhat-operator-index:${OCP_VERSION}"
          echo "Rendering catalog: ${CATALOG_IMAGE}"
          opm render "${CATALOG_IMAGE}" 2>/dev/null | \
            jq -c 'select(.schema == "olm.channel") | {package, name}' \
            > /tmp/catalog-channels.json
          echo "Extracted $(wc -l < /tmp/catalog-channels.json) channel entries"

      - name: Check for missing channel overlays
        id: check
        env:
          CATALOG_CACHE: /tmp/catalog-channels.json
        run: |
          output=$(./scripts/check-catalog-channels.sh report)
          echo "$output"
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if echo "$output" | grep -q "^  missing:"; then
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate missing overlays
        if: steps.check.outputs.has_missing == 'true' && (inputs.mode == 'generate' || github.event_name == 'schedule')
        env:
          CATALOG_CACHE: /tmp/catalog-channels.json
        run: ./scripts/check-catalog-channels.sh generate

      - name: Validate generated manifests
        if: steps.check.outputs.has_missing == 'true' && (inputs.mode == 'generate' || github.event_name == 'schedule')
        run: |
          LATEST=$(curl -s https://api.github.com/repos/kubernetes-sigs/kustomize/releases/latest | jq .name | sed 's#kustomize/##; s#"##g')
          curl "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${LATEST}/kustomize_${LATEST}_linux_amd64.tar.gz" \
            -sL | sudo tar zx -C /usr/local/bin/ kustomize
          ./scripts/validate_kustomize.sh

      - name: Create Pull Request
        if: steps.check.outputs.has_missing == 'true' && (inputs.mode == 'generate' || github.event_name == 'schedule')
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add missing operator channel overlays"
          title: "feat: add missing operator channel overlays (OCP ${{ env.OCP_VERSION }})"
          body: |
            ## Missing Operator Channel Overlays

            New OLM channels were detected in the Red Hat operator catalog index
            (`${{ env.OCP_VERSION }}`) that do not have corresponding overlay
            directories in this repository.

            <details>
            <summary>Full report</summary>

            ```
            ${{ steps.check.outputs.report }}
            ```
            </details>

            Generated by the weekly channel freshness check.
          branch: automation/missing-channels-${{ env.OCP_VERSION }}
          labels: automation
          delete-branch: true
