name: Check Operator Channel Freshness

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday 8am UTC
  workflow_dispatch:
    inputs:
      ocp_versions:
        description: 'Space-separated OCP versions (e.g., v4.18 v4.19 v4.20 v4.21 v4.22)'
        default: 'v4.18 v4.19 v4.20 v4.21 v4.22'
      mode:
        description: 'report = dry run, generate = create PR with missing/stale overlays'
        type: choice
        options:
          - report
          - generate
        default: report

env:
  OCP_VERSIONS: ${{ inputs.ocp_versions || 'v4.18 v4.19 v4.20 v4.21 v4.22' }}
  OPM_VERSION: v1.47.0

jobs:
  check-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install opm
        run: |
          curl -sLO "https://github.com/operator-framework/operator-registry/releases/download/${OPM_VERSION}/linux-amd64-opm"
          chmod +x linux-amd64-opm
          sudo mv linux-amd64-opm /usr/local/bin/opm
          opm version

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Authenticate to Red Hat registry
        run: |
          mkdir -p "${HOME}/.docker"
          echo '${{ secrets.REDHAT_PULL_SECRET }}' > "${HOME}/.docker/config.json"

      - name: Render and cache catalog data
        run: |
          mkdir -p /tmp/catalog-cache
          for version in ${OCP_VERSIONS}; do
            image="registry.redhat.io/redhat/redhat-operator-index:${version}"
            echo "Rendering catalog: ${image}"
            opm render "${image}" | \
              jq -c 'select(.schema == "olm.channel") | {package, name}' \
              > "/tmp/catalog-cache/${version}.json"
            echo "  ${version}: $(wc -l < "/tmp/catalog-cache/${version}.json") channel entries"
          done

      - name: Check for missing and stale channel overlays
        id: check
        env:
          CATALOG_CACHE_DIR: /tmp/catalog-cache
        run: |
          output=$(./scripts/check-catalog-channels.sh report)
          echo "$output"
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if echo "$output" | grep -qE "^  (missing|stale):"; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate overlay changes
        if: steps.check.outputs.has_changes == 'true' && (inputs.mode == 'generate' || github.event_name == 'schedule')
        env:
          CATALOG_CACHE_DIR: /tmp/catalog-cache
        run: ./scripts/check-catalog-channels.sh generate

      - name: Validate generated manifests
        if: steps.check.outputs.has_changes == 'true' && (inputs.mode == 'generate' || github.event_name == 'schedule')
        run: |
          LATEST=$(curl -s https://api.github.com/repos/kubernetes-sigs/kustomize/releases/latest | jq .name | sed 's#kustomize/##; s#"##g')
          curl "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${LATEST}/kustomize_${LATEST}_linux_amd64.tar.gz" \
            -sL | sudo tar zx -C /usr/local/bin/ kustomize
          ./scripts/validate_kustomize.sh

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true' && (inputs.mode == 'generate' || github.event_name == 'schedule')
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: sync operator channel overlays"
          title: "feat: sync operator channel overlays"
          body: |
            ## Operator Channel Overlay Sync

            Compared OLM channels across supported Red Hat catalog indices
            (`${{ env.OCP_VERSIONS }}`) against overlay directories in this
            repository. Missing overlays were added and stale overlays (not
            present in any supported version) were removed.

            <details>
            <summary>Full report</summary>

            ```
            ${{ steps.check.outputs.report }}
            ```
            </details>

            Generated by the weekly channel freshness check.
          branch: automation/sync-channel-overlays
          labels: automation
          delete-branch: true
