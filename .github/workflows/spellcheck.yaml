name: Check Spelling
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  lint-spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Spellcheck
        uses: rojopolis/spellcheck-github-actions@b7633f9dbd9aac05cfbebb5c5f06f66cfdafe01c # 0.71.0
